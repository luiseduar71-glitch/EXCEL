<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apuestas BET365 LERG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <main class="max-w-7xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4 text-center">Apuestas BET365 LERG</h1>

    <div class="mb-4 flex items-center justify-between">
      <label class="block">
        <span class="sr-only">Importar Excel</span>
        <input id="file-input" type="file" accept=".xlsx" class="block text-sm" />
      </label>
    </div>

    <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
      <div class="card rounded-2xl p-4 bg-white shadow"><h3 class="font-semibold">Victorias</h3><p id="kpi-wins" class="text-2xl font-bold">0</p></div>
      <div class="card rounded-2xl p-4 bg-white shadow"><h3 class="font-semibold">Derrotas</h3><p id="kpi-losses" class="text-2xl font-bold">0</p></div>
      <div class="card rounded-2xl p-4 bg-white shadow"><h3 class="font-semibold">Empates</h3><p id="kpi-draws" class="text-2xl font-bold">0</p></div>
      <div class="card rounded-2xl p-4 bg-white shadow"><h3 class="font-semibold">Saldo</h3><p id="kpi-balance" class="text-2xl font-bold">$0</p></div>
    </section>

    <section class="card rounded-2xl p-4 bg-white shadow mb-6">
      <h3 class="font-semibold mb-2">Gráfico de apuestas</h3>
      <canvas id="areaMonthly" height="120"></canvas>
    </section>

    <section class="card rounded-2xl p-4 bg-white shadow mb-6">
      <h3 class="font-semibold mb-2">Rivales más rentables</h3>
      <canvas id="barTop" height="160"></canvas>
    </section>

    <section class="card rounded-2xl p-4 bg-white shadow mb-6">
      <h3 class="font-semibold mb-2">Saldo de apuestas</h3>
      <canvas id="gauge" height="150"></canvas>
      <p id="gauge-total" class="text-center font-semibold text-lg mt-2">$0</p>
    </section>

    <section class="card rounded-2xl p-4 shadow-soft mt-6 bg-white">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold">Historial de apuestas</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="text-left text-gray-500">
            <tr>
              <th class="py-2 pr-3">#</th>
              <th class="py-2 pr-3">Rival</th>
              <th class="py-2 pr-3">Resultado</th>
              <th class="py-2 pr-3">Apuesta</th>
              <th class="py-2 pr-3">Ganancia</th>
              <th class="py-2 pr-3">Saldo acumulado</th>
              <th class="py-2 pr-3">Marcador</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    function fmtMoney(n){return isNaN(n)?'-':n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0})}
    let rawRows=[];

    document.getElementById('file-input').addEventListener('change',async(e)=>{
      const file=e.target.files?.[0];
      if(!file)return;
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:null});
      rawRows=json.map(r=>({
        rival:r['DNTRINCANTI']||r['Contrincante']||'Desconocido',
        outcome:(r['ETERMINADA']||'').toString().toLowerCase(),
        stake:Number(r['apuesta']??0),
        result:r['RESULTADO']||''
      }));
      renderAll();
    });

    let areaChart,barChart,gaugeChart;
    function ensureDestroy(chart){if(chart)chart.destroy();}

    function renderAll(){
      const rows=rawRows;
      const tbody=document.getElementById('history-body');
      if(tbody)tbody.innerHTML='';
      if(!rows||rows.length===0)return;

      const signed=rows.map(b=>({...b,value:b.outcome.includes('gano')?Math.abs(b.stake||0):-Math.abs(b.stake||0)}));
      const wins=signed.filter(b=>b.outcome.includes('gano')).length;
      const losses=signed.filter(b=>b.outcome.includes('derrota')).length;
      const draws=signed.filter(b=>b.outcome.includes('empate')).length;
      const balance=signed.reduce((a,b)=>a+(b.value||0),0);
      const total=signed.length||1;
      document.getElementById('kpi-wins').textContent=wins;
      document.getElementById('kpi-losses').textContent=losses;
      document.getElementById('kpi-draws').textContent=draws;
      document.getElementById('kpi-balance').textContent=fmtMoney(balance);

      const cumLabels=signed.map((_,i)=>`J${i+1}`);
      let acc=0;const cumValues=signed.map(b=>{acc+=b.value||0;return acc;});
      ensureDestroy(areaChart);
      areaChart=new Chart(document.getElementById('areaMonthly'),{type:'line',data:{labels:cumLabels,datasets:[{label:'Saldo',data:cumValues,fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}});

      const byRivalProfit=new Map();
      signed.forEach(b=>{const k=b.rival;byRivalProfit.set(k,(byRivalProfit.get(k)||0)+(b.value||0));});
      const top=[...byRivalProfit.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5);
      ensureDestroy(barChart);
      barChart=new Chart(document.getElementById('barTop'),{type:'bar',data:{labels:top.map(([n])=>n),datasets:[{label:'Ganancia neta',data:top.map(([,v])=>v)}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}});

      ensureDestroy(gaugeChart);
      const goal=Math.max(1,Math.abs(balance)*2);
      const pct=Math.min(1,Math.max(0,(balance+goal/2)/goal));
      gaugeChart=new Chart(document.getElementById('gauge'),{type:'doughnut',data:{labels:['Progreso','Restante'],datasets:[{data:[pct,1-pct]}]},options:{cutout:'75%',rotation:-90,circumference:180,plugins:{legend:{display:false}}}});
      document.getElementById('gauge-total').textContent=fmtMoney(balance);

      let running=0;
      const rowsHtml=signed.map((b,i)=>{running+=b.value||0;const tag=b.outcome.includes('gano')?'Ganó':b.outcome.includes('derrota')?'Perdió':'Empate';const color=b.outcome.includes('gano')?'text-emerald-700 bg-emerald-50':b.outcome.includes('derrota')?'text-rose-700 bg-rose-50':'text-amber-700 bg-amber-50';return `<tr class="border-b last:border-0"><td class="py-2 pr-3 text-gray-500">${i+1}</td><td class="py-2 pr-3">${b.rival}</td><td class="py-2 pr-3"><span class="px-2 py-1 rounded-lg ${color}">${tag}</span></td><td class="py-2 pr-3">${fmtMoney(Math.abs(b.stake||0))}</td><td class="py-2 pr-3">${fmtMoney(b.value||0)}</td><td class="py-2 pr-3 font-medium">${fmtMoney(running)}</td><td class="py-2 pr-3 text-gray-500">${b.result||''}</td></tr>`;}).join('');
      if(tbody)tbody.innerHTML=rowsHtml;
    }
  </script>
</body>
</html>
