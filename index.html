  <!-- Script JS final -->
  <script>
    // ---------- Utilidades ----------
    function fmtMoney(n) {
      if (Number.isNaN(n)) return "-";
      return n.toLocaleString("en-US", {
        style: "currency",
        currency: "USD",
        maximumFractionDigits: 0,
      });
    }

    // ---------- Estado ----------
    let rawRows = [];

    // ---------- Lectura de Excel ----------
    document.getElementById("file-input").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(ws, { defval: null });

      // Mapeo específico para tu archivo (Libro1.xlsx)
      rawRows = json.map((r) => ({
        rival: r["DNTRINCANTI"] || r["Contrincante"] || "Desconocido",
        outcome: (r["ETERMINADA"] || "").toString().toLowerCase(), // gano / derrota / empate
        stake: Number(r["apuesta"] ?? 0),
        result: r["RESULTADO"] || "",
      }));

      renderAll();
    });

    // ---------- Controles de fecha ----------
    document.getElementById("apply").addEventListener("click", renderAll);

    function filterByDate(rows) {
      const from = document.getElementById("from").value
        ? new Date(document.getElementById("from").value)
        : null;
      const to = document.getElementById("to").value
        ? new Date(document.getElementById("to").value)
        : null;
      return rows.filter((r) => {
        const d = new Date();
        if (from && d < from) return false;
        if (to && d > to) return false;
        return true;
      });
    }

    // ---------- Gráficos ----------
    let areaChart, lineChart, barChart, gaugeChart;
    function ensureDestroy(chart) {
      if (chart) chart.destroy();
    }

    function renderAll() {
      const rows = filterByDate(rawRows);

      // Si no hay datos, no hacer nada
      if (!rows || rows.length === 0) {
        console.warn("No hay datos cargados desde el Excel.");
        return;
      }

      // Reglas: gana +stake, derrota -|stake|, empate -|stake|
      const signed = rows.map((b) => ({
        ...b,
        value: b.outcome.includes("gano")
          ? Math.abs(b.stake || 0)
          : -Math.abs(b.stake || 0),
      }));

      // KPIs principales
      const wins = signed.filter((b) => b.outcome.includes("gano")).length;
      const losses = signed.filter((b) => b.outcome.includes("derrota")).length;
      const draws = signed.filter((b) => b.outcome.includes("empate")).length;
      const balance = signed.reduce((a, b) => a + (b.value || 0), 0);
      const total = signed.length || 1;

      document.getElementById("kpi-wins").textContent = wins;
      document.getElementById("kpi-losses").textContent = losses;
      document.getElementById("kpi-draws").textContent = draws;
      document.getElementById("kpi-balance").textContent = fmtMoney(balance);

      document.getElementById("chip-win").textContent =
        Math.round((wins / total) * 100) + "%";
      document.getElementById("chip-loss").textContent =
        Math.round((losses / total) * 100) + "%";
      document.getElementById("chip-draw").textContent =
        Math.round((draws / total) * 100) + "%";
      document.getElementById("chip-balance").textContent = fmtMoney(balance);

      // ---------- Gráfico acumulado ----------
      const cumLabels = signed.map((_, i) => `J${i + 1}`);
      let acc = 0;
      const cumValues = signed.map((b) => {
        acc += b.value || 0;
        return acc;
      });

      ensureDestroy(areaChart);
      areaChart = new Chart(document.getElementById("areaMonthly"), {
        type: "line",
        data: {
          labels: cumLabels,
          datasets: [
            { label: "Saldo", data: cumValues, fill: true, tension: 0.35 },
          ],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true } },
        },
      });

      ensureDestroy(lineChart);
      lineChart = new Chart(document.getElementById("lineQty"), {
        type: "line",
        data: {
          labels: cumLabels,
          datasets: [
            { label: "Saldo", data: cumValues, tension: 0.35 },
          ],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true } },
        },
      });

      // ---------- Rivales más rentables ----------
      const byRivalProfit = new Map();
      signed.forEach((b) => {
        const k = b.rival;
        byRivalProfit.set(k, (byRivalProfit.get(k) || 0) + (b.value || 0));
      });
      const top = [...byRivalProfit.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      ensureDestroy(barChart);
      barChart = new Chart(document.getElementById("barTop"), {
        type: "bar",
        data: {
          labels: top.map(([n]) => n),
          datasets: [
            { label: "Ganancia neta", data: top.map(([, v]) => v) },
          ],
        },
        options: {
          indexAxis: "y",
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true } },
        },
      });

      // ---------- Gauge del saldo ----------
      ensureDestroy(gaugeChart);
      const goal = Math.max(1, Math.abs(balance) * 2);
      const pct = Math.min(1, Math.max(0, (balance + goal / 2) / goal));
      gaugeChart = new Chart(document.getElementById("gauge"), {
        type: "doughnut",
        data: {
          labels: ["Progreso", "Restante"],
          datasets: [{ data: [pct, 1 - pct] }],
        },
        options: {
          cutout: "75%",
          rotation: -90,
          circumference: 180,
          plugins: { legend: { display: false } },
        },
      });
      document.getElementById("gauge-total").textContent = fmtMoney(balance);

      // ---------- Estadísticas por rival ----------
      const byRival = new Map();
      signed.forEach((b) => {
        const e =
          byRival.get(b.rival) || { win: 0, loss: 0, draw: 0, profit: 0, count: 0 };
        if (b.outcome.includes("gano")) e.win++;
        else if (b.outcome.includes("derrota")) e.loss++;
        else if (b.outcome.includes("empate")) e.draw++;
        e.profit += b.value || 0;
        e.count++;
        byRival.set(b.rival, e);
      });

      const best = [...byRival.entries()].sort(
        (a, b) =>
          (b[1].win / (b[1].count || 1)) - (a[1].win / (a[1].count || 1))
      )[0];
      if (best) {
        const [name, stats] = best;
        document.getElementById("tt-rival").textContent = name;
        document.getElementById("tt-winrate").textContent =
          Math.round((stats.win / (stats.count || 1)) * 100) + "%";
        document.getElementById("tt-matches").textContent = stats.count;
        document.getElementById("tt-profit").textContent = fmtMoney(stats.profit);
      }
    }
  </script>
